name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  ropa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start database and apply migrations
        run: supabase db start

      - name: Generate Record of Processing Activities
        run: node scripts/generate-ropa.mjs

      - name: Fail if committed RoPA is stale
        run: |
          if ! git diff --exit-code -- docs/compliance/ropa.md; then
            echo "::error::docs/compliance/ropa.md is stale. Run 'node scripts/generate-ropa.mjs' and commit the result."
            exit 1
          fi
